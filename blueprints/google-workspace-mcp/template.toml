[variables]
main_domain = "${domain}"

[config]
mounts = []

[[config.domains]]
serviceName = "google-workspace-mcp"
port = 8000
host = "${main_domain}"

[config.env]
MAIN_DOMAIN = "${main_domain}"
WORKSPACE_MCP_BASE_URI = "https://${main_domain}"
WORKSPACE_EXTERNAL_URL = "https://${main_domain}"
MCP_ENABLE_OAUTH21 = "true"
WORKSPACE_MCP_HOST = "0.0.0.0"
WORKSPACE_MCP_PORT = "8000"
TOOLS = "gmail drive docs sheets slides calendar"
GOOGLE_MCP_CREDENTIALS_DIR = "/app/store_creds"
GOOGLE_OAUTH_CLIENT_ID = ""
GOOGLE_OAUTH_CLIENT_SECRET = ""
GOOGLE_OAUTH_REDIRECT_URI = "https://${main_domain}/oauth2callback"
