version: "3.8"
services:
  google-workspace-mcp:
    image: ghcr.io/lem4242/google-workspace-mcp:0.1.0
    restart: unless-stopped
    volumes:
      - store_creds:/app/store_creds
    expose:
      - "8000"
    environment:
      - WORKSPACE_MCP_BASE_URI=${WORKSPACE_MCP_BASE_URI}
      - WORKSPACE_EXTERNAL_URL=${WORKSPACE_EXTERNAL_URL}
      - MCP_ENABLE_OAUTH21=${MCP_ENABLE_OAUTH21}
      - WORKSPACE_MCP_HOST=${WORKSPACE_MCP_HOST}
      - WORKSPACE_MCP_PORT=${WORKSPACE_MCP_PORT}
      - TOOLS=${TOOLS}
      - GOOGLE_MCP_CREDENTIALS_DIR=${GOOGLE_MCP_CREDENTIALS_DIR}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI}

volumes:
  store_creds: {}
