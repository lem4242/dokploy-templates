[variables]
main_domain = "${domain}"
bootstrap_token = "${password:32}"

[config]

[[config.domains]]
serviceName = "obot"
port = 8080
host = "${main_domain}"

[config.env]
env = [
  "OPENAI_API_KEY=",
  "OBOT_BOOTSTRAP_TOKEN=${bootstrap_token}",
  "OBOT_SERVER_HOSTNAME=${main_domain}",
  "OBOT_SERVER_ENABLE_AUTHENTICATION=true"
]
